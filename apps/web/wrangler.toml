name = "app-radar"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 线上通过 Hyperdrive 用只读账号连 Railway（Hyperdrive 到 Railway 走 TLS）。
# 本地开发：dev:api 脚本用环境变量 CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
# 指向 .dev.vars 里的本机数据副本，密码不进仓库。
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b55ad62a0de942b5a93182e85f53a3f0"

# 写入专用：账号 app_radar_feedback 只能读写 feedback、favorites、favorite_reviews、seen；关闭缓存，标完立刻能读到
[[hyperdrive]]
binding = "FEEDBACK_DB"
id = "939409e1cae74ed187d97c1793cfa1a4"

# Cloudflare Access：API 会校验 Access 签发的 JWT。这两个值不是密钥，配好 Access 后填入。
[vars]
ACCESS_TEAM_DOMAIN = "uamyangel.cloudflareaccess.com"
ACCESS_AUD = "ed4a1c033fe8c7f53036cd63954a5ac9b8d69ec994e251985438143ca8b129f5"
