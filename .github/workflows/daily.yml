name: daily
# 每日采集：北京时间每天 03:17（UTC 19:17，分钟避开整点；也是 DeepSeek 的非高峰时段）。
# 手动触发只有有写权限的人能用。定时触发时 inputs 为空，按默认值：全部阶段、全部国家、写库。
# 公开仓库注意：运行日志所有人可见，数据库连接信息必须先打码再使用。
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: 阶段（daily / charts / apps / reviews / classify / summaries / briefs）
        default: daily
      dry_run:
        description: 不写库，只打印
        type: boolean
        default: true
      max_minutes:
        description: 单个国家的时间上限（分钟）
        default: "330"
      countries:
        description: 国家（JSON 数组）
        default: '["us","cn","jp"]'
      limit:
        description: 调试用：每个阶段最多处理多少个单位（留空 = 不限）
        default: ""
permissions:
  contents: read
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 每个国家一台机器：各自的出口 IP 分别计算网页评论接口的限流
        country: ${{ fromJSON(inputs.countries || '["us","cn","jp"]') }}
    steps:
      # 第三方 action 锁定到 commit SHA（注释里是对应的版本）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: mask db connection parts
        # GitHub 只遮完整的 secret；连接报错时会打印 host:port 等片段，这里逐个打码
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e '
            const u = process.env.DATABASE_URL; if (!u) process.exit(0);
            const p = new URL(u);
            for (const v of [p.hostname, p.port, p.username, decodeURIComponent(p.password), p.host])
              if (v) console.log("::add-mask::" + v);
          '
      - name: collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STAGE: ${{ inputs.stage || 'daily' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '330' }}
          DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
          LIMIT: ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        # 输入通过环境变量传入，不直接拼进脚本，避免注入
        run: pnpm pipeline run --stage "$STAGE" --country "${{ matrix.country }}" --max-minutes "$MAX_MINUTES" $DRY_RUN $LIMIT
