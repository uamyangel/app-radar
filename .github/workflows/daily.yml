name: daily
# 每日采集。定时触发在 M4 打开；现在只能手动触发。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 阶段（daily / charts / apps / reviews）
        default: daily
      dry_run:
        description: 不写库，只打印
        type: boolean
        default: true
      max_minutes:
        description: 单个国家的时间上限（分钟）
        default: "330"
      countries:
        description: 国家（JSON 数组）
        default: '["us","cn","jp"]'
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 每个国家一台机器：各自的出口 IP 分别计算网页评论接口的限流
        country: ${{ fromJSON(inputs.countries || '["us","cn","jp"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          pnpm pipeline run
          --stage ${{ inputs.stage || 'daily' }}
          --country ${{ matrix.country }}
          --max-minutes ${{ inputs.max_minutes || '330' }}
          ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
