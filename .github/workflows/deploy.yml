name: deploy
# 推送到 main 且前端相关文件有变化时，自动发布到 Cloudflare Pages（app-radar-ers.pages.dev）。
# 先跑类型检查和测试，失败就不发布。CLOUDFLARE_API_TOKEN 只有「Cloudflare Pages：编辑」权限。
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "config.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck && (cd apps/web && npx tsc -p .)
      - run: pnpm test
      - name: build
        run: cd apps/web && npx vite build
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/web && npx wrangler pages deploy dist --project-name app-radar --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
