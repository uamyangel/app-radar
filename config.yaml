# 修改后无需改代码；加载时用 zod 校验，出错直接退出
countries: [us, cn, jp]
genres: [0, 6007, 6000, 6017, 6013, 6020, 6015, 6002, 6027, 6008, 6012, 6026, 6006,
         6023, 6003, 6024, 6005, 6009, 6018, 6011, 6016]
charts: [free, paid, grossing]
chart_limit: 100
lookup_batch_size: 100
reviews:
  top_n_core: 50          # 总榜 + 核心 12 品类
  top_n_secondary: 20     # 次要 8 品类
  # 主来源是 apps.apple.com 网页接口（每页 20 条），RSS 大面积返回空数据，只作兜底（见 docs/m0-report.md）
  max_pages_per_day: 20   # 每个 App 每天最多翻 20 页（400 条），遇到已入库的评论就停；头部 App 每天超过 100 条
  backfill_pages: 8       # 首次进入范围时最多翻 8 页（160 条）
  backfill_daily_cap: 200 # 每个国家每天最多回填 200 个 App（首日单国约 3 小时）
  web_min_interval_ms: 3000
  rss_fallback: true
http:
  requests_per_second: 1
  max_retries: 4
  timeout_ms: 30000
llm:
  provider: deepseek
  model: "deepseek-flash"     # 2026-11-21 按官方文档核对：DeepSeek-V4.1-Flash；调用时关闭思考模式
  daily_budget_cny: 10
  usd_cny: 7.2
  concurrency: 6
  pricing:                    # 美元/百万 token，高峰价；高峰：周一至五 UTC 01–04、06–10 点
    input_cache_hit: 0.006
    input_cache_miss: 0.3
    output: 1.2
    offpeak_factor: 0.5
  classify_batch_size: 40     # 每次调用归类多少条评论
  summary_min_reviews: 10
insights:
  # 第一层：品类白名单（按 App 自己的主品类判断）。排除：游戏(不采集)、社交 6005、购物 6024、新闻 6009、娱乐 6016
  include_genres: [6007, 6000, 6017, 6013, 6020, 6015, 6002, 6027, 6008, 6012, 6026, 6006, 6023, 6003, 6011, 6018]
  # 第二层：开发者名单（platform 只抽样找周边工具；brand、content 排除；major、normal 正常分析）
  developers_file: config/developers.yaml
  long_tail_rotation_days: 7   # 榜单靠后的 App 每 7 天采一次评论
  signals:
    stale_days: 365            # 一年没更新算陈旧
    stale_max_rank: 50
    paid_niche_max_ratings: 10000  # 付费利基：畅销榜前 50 且评分数 < 1 万（用户少但在赚钱）
    paid_niche_max_rank: 50
    rising_max_ratings: 20000
    rising_rank_delta: 20
    rising_max_rank: 50
    new_release_days: 90       # 首发 90 天内
    new_release_max_rank: 50
    weak_min_reviews: 15
    weak_below_median: 1.0     # 文字评论均分比同品类中位数低 1 分以上
    decline_min_reviews: 8
    decline_drop: 0.7          # 近 30 天均分比 31–90 天前低 0.7 以上
    keep_days: 120
flags:
  low_rating_threshold: 4.0
  low_rating_max_rank: 30
  surge_rank_delta: 20
