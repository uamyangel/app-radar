# 修改后无需改代码；加载时用 zod 校验，出错直接退出
countries: [us, cn, jp]
genres: [0, 6007, 6000, 6017, 6013, 6020, 6015, 6002, 6027, 6008, 6012, 6026, 6006,
         6023, 6003, 6024, 6005, 6009, 6018, 6011, 6016]
charts: [free, paid, grossing]
chart_limit: 100
lookup_batch_size: 100
reviews:
  top_n_core: 50          # 总榜 + 核心 12 品类
  top_n_secondary: 20     # 次要 8 品类
  # 主来源是 apps.apple.com 网页接口（每页 20 条），RSS 大面积返回空数据，只作兜底（见 docs/m0-report.md）
  max_pages_per_day: 20   # 每个 App 每天最多翻 20 页（400 条），遇到已入库的评论就停；头部 App 每天超过 100 条
  backfill_pages: 8       # 首次进入范围时最多翻 8 页（160 条）
  backfill_daily_cap: 200 # 每个国家每天最多回填 200 个 App（首日单国约 3 小时）
  web_min_interval_ms: 3000
  rss_fallback: true
http:
  requests_per_second: 1
  max_retries: 4
  timeout_ms: 30000
llm:
  provider: deepseek
  model: "deepseek-flash"     # 2026-11-21 按官方文档核对：DeepSeek-V4.1-Flash；调用时关闭思考模式
  daily_budget_cny: 10
  usd_cny: 7.2
  concurrency: 6
  pricing:                    # 美元/百万 token，高峰价；高峰：周一至五 UTC 01–04、06–10 点
    input_cache_hit: 0.006
    input_cache_miss: 0.3
    output: 1.2
    offpeak_factor: 0.5
  classify_batch_size: 40     # 每次调用归类多少条评论
  summary_min_reviews: 10
insights:
  # 第一层：品类白名单（按 App 自己的主品类判断）。排除：游戏(不采集)、社交 6005、购物 6024、新闻 6009、娱乐 6016
  include_genres: [6007, 6000, 6017, 6013, 6020, 6015, 6002, 6027, 6008, 6012, 6026, 6006, 6023, 6003, 6011, 6018]
  # 第二层：开发者名单（platform 只抽样找周边工具；brand、content 排除；major、normal 正常分析）
  developers_file: config/developers.yaml
  # 各订阅每一步的默认模型。cursor 只用自家模型（Composer、Grok，额度充足；其他模型超额按量计费）。
  # 2026-11-23 实测（pnpm insights:bench，6 个模型 × 三步 × 两遍）：
  #   提取 grok-4.7-low-fast：类型判断和 Sonnet 参照一致 80%（Composer 66%），70 秒/60 条
  #   归并 cursor-grok-4.6-low-fast：两遍一致 89%（Composer 78%），122 秒/150 条；grok-4.7 质量相同但慢一倍，大目录有超时风险
  #   卡片 grok-4.7-high-fast：对「个人做不了」的判断最诚实、切入点最具体，约 110 秒/张；卡片调用次数少，值得用最好的
  default_models:
    cursor: { extract: grok-4.7-low-fast, assign: cursor-grok-4.6-low-fast, cards: grok-4.7-high-fast }
  # 定时自动运行（scripts/insights-agent.sh install 安装；开机、醒来、每 30 分钟检查一次，有待办才跑）
  auto: { provider: cursor, max_calls: 800, concurrency: 4, min_battery: 40 }
  long_tail_rotation_days: 7   # 榜单靠后的 App 每 7 天采一次评论
  signals:
    stale_days: 365            # 一年没更新算陈旧
    stale_max_rank: 50
    paid_niche_max_ratings: 10000  # 付费利基：畅销榜前 50 且评分数 < 1 万（用户少但在赚钱）
    paid_niche_max_rank: 50
    rising_max_ratings: 20000
    rising_rank_delta: 20
    rising_max_rank: 50
    new_release_days: 90       # 首发 90 天内
    new_release_max_rank: 50
    weak_min_reviews: 15
    weak_below_median: 1.0     # 文字评论均分比同品类中位数低 1 分以上
    decline_min_reviews: 8
    decline_drop: 0.7          # 近 30 天均分比 31–90 天前低 0.7 以上
    keep_days: 120
  pipeline:
    window_days: 90
    extract_batch: 60
    assign_batch: 150
    # 4–5 星评论里提了需求的也分析（英、中、日常见说法）
    request_pattern: "wish|please add|would (be|love)|hope (you|they)|need(s)? (a|an|to)|missing|if only|feature request|希望|建议|能不能|能否|要是|就好了|期待|ほしい|欲しい|してほしい|追加して|できたら|いいのに|要望"
    main_min_mentions: 3
    main_min_apps: 2
    main_single_app_mentions: 5
    main_single_app_prevalence: 0.10
    # 新设备 / 新系统适配：用户要的是现有 App 适配新设备或新系统，现有 App 通常过一段时间会自己补上，不是个人的机会。
    # 只看「平台空白」类需求的标题和对象。真空白（没有 iPad / Watch / Mac 版、没有小组件、同步方式）不算。新设备发布后把名字加进 pattern。
    adaptation:
      pattern: "双屏|折叠|Duo|新款|新机|新设备|新系统|系统升级|系统更新|升级后|旧系统|旧设备|旧版(操作)?系统|低版本|iOS ?\\d+|液态玻璃|屏幕尺寸|不同尺寸|长期未更新|兼容(新|旧|最新|较低|更低|低版本)|兼容性"
      except: "iPad|平板|Watch|手表|Mac|电脑|安卓|Android|小组件|深色|同步|迁移"
      weight: 0.3
    cards_per_genre: 12
    card_rewrite_growth: 0.3
    feasibility_by_kind:    # 可做性：高 1.0 / 中 0.6 / 低 0.25（设计文档第 2 节）
      missing_feature: 1.0
      simplicity: 1.0
      pricing: 1.0
      ads: 1.0
      platform: 1.0
      localization: 1.0
      privacy: 1.0
      interop: 1.0
      quality: 0.6
      performance: 0.6
      reliability: 0.25
      account_service: 0.25
      content: 0.25
      other: 0.4
flags:
  low_rating_threshold: 4.0
  low_rating_max_rank: 30
  surge_rank_delta: 20
